<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Green Plaid Jumper — Ver 3</title>
<style>
  html,body{margin:0;background:#1e1e24;height:100%}
  canvas{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
  .hud{
    position:fixed;left:50%;transform:translateX(-50%);top:8px;
    color:#fff;font:16px/1.2 monospace;text-shadow:0 2px 0 #000;
    display:flex;gap:24px;align-items:center;z-index:2
  }
  .pill{background:#0008;padding:4px 8px;border:1px solid #fff3;border-radius:6px}
  .btn{cursor:pointer;user-select:none;border:1px solid #fff3;border-radius:6px;padding:4px 8px;background:#0008}
  .hint{
    position:fixed;left:50%;transform:translateX(-50%);bottom:10px;
    color:#ccc;font:14px monospace;opacity:.9;text-align:center;z-index:2
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div class="hud">
  <div class="pill" id="score">Score: 0</div>
  <div class="pill" id="hits">Hits: 0 / 3</div>
  <div class="pill" id="dist">m: 0</div>
  <div class="btn" id="muteBtn" aria-label="Toggle music (M)">♪ Music: On</div>
  <div class="pill">Ver 3</div>
</div>
<div class="hint">← → move • Space jump (double-jump ≈ 2× height) • Wolves patrol • Bigger spikes & clear pits • +10 per wolf passed</div>

<script>
(() => {
  // ===== Canvas =====
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;

  // ===== HUD =====
  const scoreEl = document.getElementById('score');
  const hitsEl  = document.getElementById('hits');
  const distEl  = document.getElementById('dist');
  const muteBtn = document.getElementById('muteBtn');

  // ===== Input =====
  const keys = {left:false,right:false,jump:false,jumpPressed:false};
  addEventListener('keydown',e=>{
    if(e.code==='ArrowLeft'){keys.left=true;e.preventDefault();}
    if(e.code==='ArrowRight'){keys.right=true;e.preventDefault();}
    if(e.code==='Space'){ if(!keys.jump) keys.jumpPressed=true; keys.jump=true; e.preventDefault();}
    if(e.code==='KeyM'){ toggleMusic(); }
    startAudioOnFirstGesture();
  },{passive:false});
  addEventListener('keyup',e=>{
    if(e.code==='ArrowLeft') keys.left=false;
    if(e.code==='ArrowRight') keys.right=false;
    if(e.code==='Space') keys.jump=false;
  });
  addEventListener('pointerdown',()=>startAudioOnFirstGesture(),{passive:true});

  // ===== World =====
  const GROUND_Y = H - 88;  // slightly taller ground for bigger spikes
  const world = {
    cameraX: 0,
    pits: [],      // {x,w}
    platforms: [], // {x,y,w,h}
    spikes: [],    // {x,y,w,h}
    lastGenX: 0,
  };

  // Utility
  const rand = (a,b)=>a+Math.random()*(b-a);
  const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

  // Generate terrain ahead (endless style)
  function genUpTo(xMax){
    while(world.lastGenX < xMax + 1200){
      const start = world.lastGenX;

      // choose chunk type
      const pitChance = 0.2;
      if(Math.random()<pitChance){
        const w = 140 + Math.random()*200;
        world.pits.push({x:start, w});
        // bigger spikes after pit edge sometimes
        if (Math.random()<0.6){
          world.spikes.push({x:start+w-48, y:GROUND_Y-24, w:56, h:24});
        }
        world.lastGenX += w + 240 + Math.random()*260;
      } else {
        // flat stretch
        const flatW = 360 + Math.random()*420;

        // add 1–2 platforms
        const n = 1 + (Math.random()<0.65?1:0);
        for (let i=0;i<n;i++){
          const px = start + 90 + Math.random()*(flatW-180);
          const py = GROUND_Y - (140 + Math.random()*150);
          const pw = 120 + Math.random()*160;
          world.platforms.push({x:px, y:py, w:pw, h:18});
          // larger spikes on ground after platform sometimes
          if(Math.random()<0.4){
            world.spikes.push({x:px+pw+24, y:GROUND_Y-24, w:48, h:24});
          }
        }
        world.lastGenX += flatW;
      }
    }
  }

  function pitAtX(x){
    for(const p of world.pits){ if (x>=p.x && x<=p.x+p.w) return p; }
    return null;
  }

  // ===== Player (bigger, more cartoony) =====
  const player = {
    x: 80, y: GROUND_Y-64, w: 48, h: 64,
    vx: 0, vy: 0,
    onGround: true, onPlatform: null,
    jumps: 0, maxJumps: 2,
    facing: 1,
    hits: 0, invuln: 0,
    fartFloat: 0,
    dist: 0
  };

  // Tuned movement (less drastic)
  const phys = {
    gravity: 0.7,
    floatGravity: 0.5,       // milder float
    moveAccel: 0.5,
    maxSpeed: 3.6,           // slower horizontal
    friction: 0.84,
    jumpVel: -10.5,          // same as double, ~2× total with two jumps
    doubleJumpVel: -10.5,
    scrollEase: 0.12,
  };

  // ===== Wolves (slower, patrol in a range) =====
  const wolves = [];
  let spawnTimer = 0;

  function findGroundXNear(x){
    // nudge forward until not over a pit
    let tries=12, xi=x;
    while(tries--){
      if(!pitAtX(xi)) return xi;
      xi += 120;
    }
    return x;
  }

  function spawnWolf(){
    const base = findGroundXNear(player.x + 650 + Math.random()*450);
    const patrolW = 100 + Math.random()*220;
    const left = base - patrolW/2;
    const right = base + patrolW/2;
    const speed = 1.2 + Math.random()*0.7; // slower than before
    wolves.push({
      x: clampToGroundRange(left+Math.random()*patrolW), y:GROUND_Y-32,
      w: 56, h: 32,
      vx: speed * (Math.random()<0.5?-1:1),
      left, right, scored:false
    });
    spawnTimer = 110 + Math.random()*140;
  }

  function clampToGroundRange(x){
    // ensure the given x is not inside a pit; if so, move to pit edge
    const p = pitAtX(x);
    if (!p) return x;
    return p.x + p.w + 2;
  }

  // ===== Particles =====
  const particles=[];
  function emitFart(x,y){
    for(let i=0;i<10;i++)
      particles.push({x:x+rand(-3,3),y:y+rand(0,8),vx:rand(-0.9,0.9),vy:rand(-0.7,-0.1),life:22+Math.random()*10,r:3+Math.random()*3,type:'fart'});
  }
  function emitHit(x,y){
    for(let i=0;i<10;i++)
      particles.push({x:x+rand(-6,6),y:y+rand(-6,6),vx:rand(-1.4,1.4),vy:rand(-1.1,0.8),life:18+Math.random()*8,r:2+Math.random()*3,type:'hit'});
  }

  // ===== Score/State =====
  let score = 0, gameOver=false, restartT=0;
  function addScore(n){ score+=n; scoreEl.textContent='Score: '+score; }
  function updateHUD(){
    hitsEl.textContent = `Hits: ${player.hits} / 3`;
    distEl.textContent = `m: ${Math.floor(player.dist/40)}`;
    scoreEl.textContent = `Score: ${score}`;
  }
  function resetGame(){
    world.cameraX = 0;
    world.pits.length=0; world.platforms.length=0; world.spikes.length=0; world.lastGenX=0;
    genUpTo(1200);
    player.x = 80; player.y = GROUND_Y-player.h; player.vx=0; player.vy=0; player.onGround=true; player.jumps=0; player.hits=0; player.invuln=0; player.fartFloat=0; player.dist=0;
    wolves.length=0; spawnTimer = 70;
    particles.length=0;
    score=0; gameOver=false; restartT=0;
    updateHUD();
  }

  // ===== Music =====
  let audioCtx=null, masterGain=null, musicTimerId=null, musicOn=true, musicStarted=false;
  const melody = [['C5',1],['E5',1],['G5',1],['E5',1],['D5',1],['F5',1],['A5',1],['G5',1],['E5',2],['R',2]];
  const tempo = 136, beatMs = 60000/tempo;
  function noteToFreq(n){ if(n==='R')return 0; const A4=440; const map={C:-9,'C#':-8,Db:-8,D:-7,'D#':-6,Eb:-6,E:-5,F:-4,'F#':-3,Gb:-3,G:-2,'G#':-1,Ab:-1,A:0,'A#':1,Bb:1,B:2}; const m=n.match(/^([A-G]#?|Ab|Bb|Db|Eb|Gb)(\d)$/); if(!m)return 0; const semi=(map[m[1]]??0)+((+m[2]-4)*12); return A4*Math.pow(2,semi/12);}
  function startMusic(){ if(!musicOn||musicStarted)return; audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); masterGain=audioCtx.createGain(); masterGain.gain.value=0.15; masterGain.connect(audioCtx.destination); musicStarted=true; let i=0; (function tick(){ if(!musicOn)return; const now=audioCtx.currentTime; const [n,b]=melody[i]; const dur=(b*beatMs)/1000; const f=noteToFreq(n); if(f){ const oB=audioCtx.createOscillator(); oB.type='square'; oB.frequency.value=f/2; const gB=audioCtx.createGain(); gB.gain.value=0.06; oB.connect(gB).connect(masterGain); oB.start(now); oB.stop(now+dur*0.98); const o=audioCtx.createOscillator(); o.type='square'; o.frequency.value=f; const g=audioCtx.createGain(); g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(0.18,now+0.01); g.gain.exponentialRampToValueAtTime(0.07,now+0.08); g.gain.linearRampToValueAtTime(0.02,now+dur); o.connect(g).connect(masterGain); o.start(now); o.stop(now+dur*0.98);} i=(i+1)%melody.length; musicTimerId=setTimeout(tick,b*beatMs); })(); }
  function stopMusic(){ musicOn=false; if(musicTimerId)clearTimeout(musicTimerId); if(masterGain){try{masterGain.disconnect()}catch{}} muteBtn.textContent='♪ Music: Off'; }
  function resumeMusic(){ musicOn=true; muteBtn.textContent='♪ Music: On'; startMusic(); }
  function toggleMusic(){ if(musicOn) stopMusic(); else resumeMusic(); }
  function startAudioOnFirstGesture(){ if(!musicStarted && musicOn) startMusic(); }
  muteBtn.addEventListener('click',toggleMusic);

  // ===== Core Loop =====
  let last=0;
  requestAnimationFrame(loop);
  function loop(ts){
    requestAnimationFrame(loop);
    const dt=(ts-last)/16.67 || 1; last=ts;
    update(dt);
    draw();
  }

  // ===== Physics & Collisions =====
  function update(dt=1){
    if (gameOver){ restartT-=dt; if(restartT<=0) resetGame(); return; }

    // Input
    if (keys.left){ player.vx -= phys.moveAccel*dt; player.facing=-1; }
    if (keys.right){ player.vx += phys.moveAccel*dt; player.facing= 1; }
    player.vx = Math.max(-phys.maxSpeed, Math.min(phys.maxSpeed, player.vx));

    // Jump
    if (keys.jumpPressed){
      if (player.onGround){
        player.vy = phys.jumpVel;
        player.onGround=false; player.onPlatform=null; player.jumps=1;
      } else if (player.jumps < player.maxJumps){
        player.vy = phys.doubleJumpVel;
        player.jumps++;
        player.fartFloat = 18; // very short float window
        emitFart(player.x+player.w/2, player.y+player.h-6);
      }
      keys.jumpPressed=false;
    }

    // Gravity
    if (!player.onGround){
      player.vy += (player.fartFloat>0 ? phys.floatGravity : phys.gravity)*dt;
      if (player.fartFloat>0) player.fartFloat-=dt;
    }

    // Integrate
    const prevX = player.x, prevY = player.y;
    player.x += player.vx * dt * 3.0;
    player.y += player.vy * dt * 3.0;

    // Friction when grounded
    if (player.onGround) player.vx *= Math.pow(phys.friction, dt);

    // Reset ground state for this frame
    player.onGround=false; player.onPlatform=null;

    // ---- One-way platform collision (robust, prevents tunneling) ----
    // Check any platform where horizontal overlaps and we crossed its top between frames
    const pBottomPrev = prevY + player.h;
    const pBottomNow  = player.y + player.h;
    for (const pf of world.platforms){
      if (player.vy >= 0 // falling
          && prevY + player.h <= pf.y + 2 // was above
          && player.x + player.w > pf.x && player.x < pf.x + pf.w // horizontal overlap
          && pBottomPrev <= pf.y && pBottomNow >= pf.y) // crossed the top
      {
        player.y = pf.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.onPlatform = pf;
        player.jumps = 0;
        player.fartFloat=0;
      }
    }

    // ---- Ground baseline (support on both feet; matches visuals) ----
    const footL = player.x + 6;
    const footR = player.x + player.w - 6;
    const leftOverPit  = !!pitAtX(footL);
    const rightOverPit = !!pitAtX(footR);

    if (!player.onGround && !leftOverPit && !rightOverPit && player.y + player.h >= GROUND_Y){
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumps = 0;
      player.fartFloat=0;
    }

    // ---- Spikes damage (bigger & clearer) ----
    if (player.invuln>0) player.invuln -= dt;
    else {
      for (const s of world.spikes){
        if (rectOverlap(player, s)){
          player.hits++; player.invuln = 40; emitHit(player.x+player.w/2, player.y+player.h/2);
          player.vy = -7; player.vx += (player.x < s.x ? -2.2 : 2.2);
          updateHUD();
          if (player.hits >= 3) triggerKO();
          break;
        }
      }
    }

    // ---- Pits: fall if Y off-screen ----
    if (player.y > H + 80){ triggerKO(true); }

    // Keep from going far left
    if (player.x < 0){ player.x = 0; player.vx = Math.max(0, player.vx); }

    // ---- Camera ----
    const targetCam = player.x - W*0.45;
    world.cameraX += (targetCam - world.cameraX) * phys.scrollEase;
    if (world.cameraX < 0) world.cameraX = 0;

    // ---- Generate more ----
    genUpTo(world.cameraX + W + 900);

    // ---- Wolves (patrol between left/right; avoid pits) ----
    spawnTimer -= dt;
    if (spawnTimer <= 0) spawnWolf();

    for (let i=wolves.length-1;i>=0;i--){
      const w = wolves[i];
      w.x += w.vx * dt * 3.0;

      // bounce at patrol edges
      if (w.x < w.left){ w.x = w.left; w.vx = Math.abs(w.vx); }
      if (w.x + w.w > w.right){ w.x = w.right - w.w; w.vx = -Math.abs(w.vx); }

      // keep wolves off pits: if next step lands in pit, flip direction
      const mid = w.x + w.w/2;
      if (pitAtX(mid)){ w.vx = -w.vx; w.x += w.vx * dt * 3.0; }

      // scoring: passed behind player once
      if (!w.scored && w.right < player.x - 10){ addScore(10); w.scored = true; }

      // damage
      if (player.invuln<=0 && rectOverlap(shrinkRect(player,6), w)){
        player.hits++; player.invuln=40; emitHit(player.x+player.w/2, player.y+player.h/2);
        player.vy = -7;
        updateHUD();
        if (player.hits >= 3) triggerKO();
      }

      // cull far behind
      if (w.right < world.cameraX - 300) wolves.splice(i,1);
    }

    // ---- Particles ----
    for (let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x += p.vx * dt * 2.0; p.y += p.vy * dt * 2.0; p.vy += 0.05*dt; p.life -= dt;
      if (p.life<=0) particles.splice(i,1);
    }

    // distance
    player.dist = Math.max(player.dist, player.x);
    updateHUD();
  }

  function triggerKO(){ gameOver = true; restartT=70; }

  function rectOverlap(a,b){
    return !(a.x+a.w<=b.x || a.x>=b.x+b.w || a.y+a.h<=b.y || a.y>=b.y+b.h);
  }
  function shrinkRect(r,m){ return {x:r.x+m,y:r.y+m,w:r.w-2*m,h:r.h-2*m}; }

  // ===== Rendering =====
  function draw(){
    // sky
    ctx.fillStyle='#71c8ff'; ctx.fillRect(0,0,W,H);

    // parallax hills
    const cam = world.cameraX;
    drawParallax(cam);

    // ground (draw only non-pit segments so visuals == collisions)
    drawGroundSegments(cam);

    // platforms
    for(const pf of world.platforms){
      if (pf.x+pf.w < cam-50 || pf.x > cam+W+50) continue;
      drawPlatform(pf, cam);
    }

    // spikes (larger + triangle teeth)
    for(const s of world.spikes){
      if (s.x+s.w < cam-80 || s.x > cam+W+80) continue;
      drawSpikes(s, cam);
    }

    // wolves
    for(const w of wolves){
      if (w.right < cam-80 || w.left > cam+W+80) continue;
      drawWolf(w, cam);
    }

    // player
    drawBoy(player, cam);

    // particles
    drawParticles(cam);

    if (gameOver){
      ctx.fillStyle='#000a'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='28px monospace'; ctx.textAlign='center';
      ctx.fillText('Ouch! Restarting…', W/2, H/2);
    }
  }

  function drawParallax(camX){
    // distant mountains
    ctx.fillStyle='#93e3a2';
    for (let i=0;i<6;i++){
      const x = Math.floor((i*260 - (camX*0.3)%260));
      ctx.fillRect(x, H-210, 220, 22);
      ctx.fillRect(x+40, H-232, 160, 18);
    }
    // clouds
    ctx.fillStyle='#ffffffaa';
    for (let i=0;i<5;i++){
      const x = Math.floor((i*320 - (camX*0.15)%320));
      ctx.fillRect(x, 70+ (i%2)*18, 70, 16);
      ctx.fillRect(x+22, 60+ (i%2)*18, 48, 16);
    }
  }

  function drawGroundSegments(camX){
    // Determine visible band
    const left = camX - 40, right = camX + W + 40;
    // Collect pits overlapping band
    const pits = world.pits.filter(p => p.x < right && (p.x+p.w) > left)
                           .sort((a,b)=>a.x-b.x);

    // Walk from left to right, drawing ground between pits
    let cursor = left;
    ctx.fillStyle='#6b4a2e';
    for (const p of pits){
      const segL = Math.max(cursor, p.x);
      if (segL > cursor){
        // draw ground from cursor to segL
        const gx = Math.floor(cursor - camX);
        const gw = Math.floor(segL - cursor);
        ctx.fillRect(gx, GROUND_Y, gw, H-GROUND_Y);
      }
      cursor = p.x + p.w;
    }
    // tail segment
    if (cursor < right){
      const gx = Math.floor(cursor - camX);
      const gw = Math.floor(right - cursor);
      ctx.fillRect(gx, GROUND_Y, gw, H-GROUND_Y);
    }

    // grass line across non-pit segments (simple continuous strip for clarity)
    ctx.fillStyle='#39a854';
    ctx.fillRect(-camX, GROUND_Y-10, W+2000, 12);

    // carve pits visually with sky color (for crisp edges)
    ctx.fillStyle='#71c8ff';
    for (const p of pits){
      const sx = Math.floor(p.x - camX);
      ctx.fillRect(sx, GROUND_Y-10, Math.ceil(p.w), H-(GROUND_Y-10));
    }
  }

  function drawPlatform(pf, camX){
    const x = Math.floor(pf.x - camX), y = Math.floor(pf.y);
    ctx.fillStyle='#8d735a'; ctx.fillRect(x, y, pf.w, pf.h);
    ctx.fillStyle='#49b765'; ctx.fillRect(x, y-8, pf.w, 8);
    // supports
    ctx.fillStyle='#735a46';
    for (let i=10;i<pf.w;i+=26){ ctx.fillRect(x+i, y+pf.h, 3, 12); }
  }

  function drawSpikes(s, camX){
    const x = Math.floor(s.x - camX), y = Math.floor(s.y);
    ctx.fillStyle='#444'; ctx.fillRect(x, y+s.h-5, s.w, 5);
    ctx.fillStyle='#ddd';
    const step = 10;
    for (let i=0;i<s.w;i+=step){
      const bx = x+i;
      ctx.beginPath();
      ctx.moveTo(bx, y+s.h-5);
      ctx.lineTo(bx+step/2, y);
      ctx.lineTo(bx+step, y+s.h-5);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawParticles(camX){
    for (const p of particles){
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life/25));
      ctx.fillStyle = p.type==='fart' ? '#c9f2be' : '#ffd36b';
      ctx.fillRect(Math.floor(p.x - camX), Math.floor(p.y), p.r, p.r);
    }
    ctx.globalAlpha = 1;
  }

  function drawWolf(w, camX){
    const x = Math.floor(w.x - camX), y = Math.floor(w.y);
    // body (rounded box)
    ctx.fillStyle = '#7a6f67'; ctx.fillRect(x+6, y+6, w.w-12, w.h-10);
    // back
    ctx.fillStyle = '#6a5f58'; ctx.fillRect(x+2, y+10, w.w-4, w.h-14);
    // head (bigger/cute)
    ctx.fillStyle = '#6a5f58'; ctx.fillRect(x-14, y+2, 26, 20);
    // ear
    ctx.fillStyle = '#524a45'; ctx.fillRect(x+2, y-6, 10, 10);
    // eye
    ctx.fillStyle = '#000'; ctx.fillRect(x-4, y+9, 3, 3);
    // nose + blush
    ctx.fillRect(x-16, y+15, 5, 5);
    ctx.fillStyle = '#ff9bb3'; ctx.fillRect(x, y+13, 4, 4);
    // legs
    ctx.fillStyle = '#524a45';
    ctx.fillRect(x+8, y+w.h-12, 7, 10);
    ctx.fillRect(x+w.w-18, y+w.h-12, 7, 10);
  }

  function drawBoy(p, camX){
    if (p.invuln>0 && (Math.floor(p.invuln*3)%2===0)) return;
    const x = Math.floor(p.x - camX), y = Math.floor(p.y), w=p.w, h=p.h;

    // shoes
    ctx.fillStyle='#141414'; ctx.fillRect(x+7, y+h-5, w-14, 5);

    // legs (jeans)
    ctx.fillStyle='#2f2f3a'; ctx.fillRect(x+9, y+h-22, w-18, 18);
    ctx.fillStyle='#3b3b49'; ctx.fillRect(x+9, y+h-18, w-18, 3);

    // torso base (green)
    ctx.fillStyle='#1f8a36'; ctx.fillRect(x+7, y+16, w-14, h-36);

    // plaid (thicker grid)
    ctx.fillStyle='#98e59b';
    for (let sx=x+8; sx<x+w-14; sx+=6) ctx.fillRect(sx, y+16, 2, h-36);
    for (let sy=y+16; sy<y+h-20; sy+=6) ctx.fillRect(x+7, sy, w-14, 2);

    // arms
    ctx.fillStyle='#1f8a36';
    ctx.fillRect(x-2, y+22, 10, 12);
    ctx.fillRect(x+w-8, y+22, 10, 12);
    // hands
    ctx.fillStyle='#ffcc99';
    ctx.fillRect(x-2, y+32, 8, 8);
    ctx.fillRect(x+w-8, y+32, 8, 8);

    // head
    ctx.fillStyle='#ffcc99'; ctx.fillRect(x+12, y-2, w-24, 18);

    // hair (bigger swoop)
    ctx.fillStyle='#121212';
    ctx.fillRect(x+8, y-4, w-16, 9);
    ctx.fillRect(x+ (p.facing===1? w-22 : 8), y-2, 8, 6);

    // eyes + smile
    ctx.fillStyle='#000';
    const eyeX = p.facing===1 ? x+w-22 : x+14;
    ctx.fillRect(eyeX, y+6, 3, 3);
    ctx.fillStyle='#8a3b3b';
    ctx.fillRect(x+w/2-3, y+12, 6, 2);

    if (p.fartFloat>0){ ctx.globalAlpha=0.7; ctx.fillStyle='#c9f2be'; ctx.fillRect(x+10, y+h-8, 8,5); ctx.globalAlpha=1; }
  }

  // ===== Start =====
  resetGame();

})();
</script>
